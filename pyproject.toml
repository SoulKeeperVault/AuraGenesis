[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auragenesis"
version = "4.3.0"
description = "Evolving artificial consciousness with physical embodiment — research prototype"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "SoulKeeperVault", email = "contact@soulkeeper.dev"}
]
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
  "numpy>=1.26.4",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.0.0",
  "schedule>=1.2.2",
  "streamlit>=1.35.0",
  "plotly>=5.22.0",
  "openai>=1.30.0",
  "httpx>=0.27.0",
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.3",
  "torch>=2.3.0",
  "transformers>=4.40.0",
  "APScheduler>=3.10.4",
  "tqdm>=4.66.4",
  "opencv-python>=4.10.0",
  "face-recognition>=1.3.0",
  "dlib>=19.24.0",
  "faster-whisper>=1.0.0",
  "pyttsx3>=2.90",
  "bleak>=0.22.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pytest>=8.1.0",
  "pytest-cov>=5.0.0",
  "pre-commit>=3.7.0",
  "hypothesis>=6.100.0",
]
pi = [
  "adafruit-circuitpython-ds18b20>=2.3.0",
  "adafruit-blinka>=8.0.0",
  "pyaudio>=0.2.14",
]

[project.scripts]
auragenesis = "AuraGenesis.main:awaken_aura"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "F401"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=AuraGenesis --cov-report=term-missing"
testpaths = ["AuraGenesis/tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["AuraGenesis*"]
