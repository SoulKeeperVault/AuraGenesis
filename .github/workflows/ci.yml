# ── AuraGenesis GitHub Actions CI ─────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: pip install ruff mypy pydantic pydantic-settings
      - name: Run ruff
        run: ruff check AuraGenesis/
      - name: Run mypy
        run: mypy AuraGenesis/ --strict --ignore-missing-imports

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          pip install pytest pytest-cov pyyaml pydantic numpy
      - name: Run tests with coverage
        working-directory: AuraGenesis
        run: pytest --cov=AuraGenesis --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
