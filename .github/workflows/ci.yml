# ── AuraGenesis GitHub Actions CI ─────────────────────────────────────
# Runs on every push and pull request to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: pip install ruff mypy pydantic pydantic-settings
      - name: Run ruff
        run: ruff check AuraGenesis/ --ignore E501,F401
      - name: Run mypy (strict)
        run: mypy AuraGenesis/ --strict --ignore-missing-imports

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight deps only
        run: |
          pip install pytest pyyaml pydantic numpy
      - name: Run tests
        working-directory: AuraGenesis
        run: pytest tests/ -v --tb=short
